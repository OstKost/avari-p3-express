name: CI Pipeline

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Agent harness (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: make check-harness
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-check-logs-${{ runner.os }}
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 7

  backend-test-and-lint:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Format, Vet, Race Tests and Build
        run: make check-api

      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-check-logs
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 7

  frontend-test-and-lint:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint, Typecheck and Build Bundle
        run: make check-web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Browser and stdio agent workflow
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          cd ../..
          make check-browser

      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-logs
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 7
