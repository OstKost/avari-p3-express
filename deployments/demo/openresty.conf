# Dedicated include in /opt/om/nginx/conf/sites/p3express-demo.conf.
# The OpenResty Manager continues to manage its other sites.
server {
    listen 80;
    server_name p3express.avari.dev;
    location ^~ /.well-known/acme-challenge/ { root /opt/avari-p3-express/acme; }
    location / { return 301 https://p3express.avari.dev$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name p3express.avari.dev;
    ssl_certificate /etc/letsencrypt/live/p3express.avari.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p3express.avari.dev/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:14800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
