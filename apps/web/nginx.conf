server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    location = /healthz {
        proxy_pass http://api:4820/healthz;
        proxy_set_header Host $host;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container in docker-compose
    location /api/ {
        proxy_pass http://api:4820/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy short link redirects to backend
    location /s/ {
        proxy_pass http://api:4820/s/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy swagger to backend
    location /swagger/ {
        proxy_pass http://api:4820/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
